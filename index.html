<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel GIL IPTV</title>
    <!-- Biblioteca para ler QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #08070A; color: #fff; padding: 20px; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 5px; border: none; font-size: 14px; box-sizing: border-box;}
        input { background: #222; color: #fff; }
        button { background: #0B8431; color: #fff; font-weight: bold; cursor: pointer; }
        .cliente-card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .btn-danger { background: #E92B5D; }
        .btn-scan { background: #FFC527; color: #000; margin-bottom: 10px;}
        #reader { width: 100%; max-width: 400px; margin: 10px auto; display: none; border: 2px solid #0B8431; border-radius: 10px; }
    </style>
</head>
<body>
    <h2>Painel de Controle GIL IPTV</h2>

    <div class="cliente-card">
        <h3>Adicionar/Atualizar Cliente</h3>
        
        <!-- BOTÃO DE ESCANEAR QR CODE -->
        <button onclick="abrirScanner()" class="btn-scan">📷 Escanear QR Code do App</button>
        <div id="reader"></div>

        <input type="text" id="id" placeholder="ID do Aparelho (ou escaneie acima)">
        <input type="text" id="server" placeholder="Servidor (Ex: http://servidor.com:8080)">
        <input type="text" id="user" placeholder="Usuário">
        <input type="text" id="pass" placeholder="Senha">
        <label style="display:block; margin-top:10px;"><input type="checkbox" id="bloqueado" style="width:auto; margin-right:10px;"> Bloquear este cliente?</label>
        <button onclick="salvar()" style="margin-top:10px;">Salvar Cliente</button>
    </div>

    <h3>Clientes Cadastrados</h3>
    <div id="listaClientes"></div>

    <button onclick="baixarJSON()" style="background: #FFC527; color: #000; margin-top: 20px;">Baixar arquivo JSON</button>

    <script>
        let dados = JSON.parse(localStorage.getItem('gil_dados')) || { clientes: {} };
        let html5QrcodeScanner = null;

        // --- LÓGICA DO SCANNER DE QR CODE ---
        function abrirScanner() {
            const reader = document.getElementById('reader');
            if (reader.style.display === 'block') {
                fecharScanner();
                return;
            }
            
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            html5QrcodeScanner.start(
                { facingMode: "environment" }, // Câmera traseira
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // SUCESSO AO LER O QR CODE
                    let idLido = decodedText;

                    // Se o QR Code tiver o link completo, extrai apenas o ID
                    if (decodedText.includes("?id=")) {
                        const urlParams = new URLSearchParams(decodedText.split('?')[1]);
                        idLido = urlParams.get('id');
                    }

                    document.getElementById('id').value = idLido;
                    fecharScanner();
                    alert("ID Lido com sucesso: " + idLido);
                },
                (errorMessage) => {
                    // Ignora os erros de leitura contínua
                }
            ).catch((err) => {
                alert("Erro ao abrir câmera: " + err);
                fecharScanner();
            });
        }

        function fecharScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    document.getElementById('reader').style.display = 'none';
                }).catch(err => console.log(err));
            }
        }

        // ✅ NOVO: Verifica se o link aberto tem o parâmetro ?id=
        function checarLinkDireto() {
            const urlParams = new URLSearchParams(window.location.search);
            const idDaUrl = urlParams.get('id');
            
            if (idDaUrl) {
                document.getElementById('id').value = idDaUrl;
                // Limpa a URL para não ficar com ?id= na barra de endereços
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // --- LÓGICA DO PAINEL ---
        function renderizar() {
            const div = document.getElementById('listaClientes');
            div.innerHTML = '';
            for (const [id, cliente] of Object.entries(dados.clientes)) {
                const status = cliente.bloqueado ? '🔴 BLOQUEADO' : '🟢 LIBERADO';
                const idCurto = id.substring(0, 8) + '...' + id.substring(id.length - 4);
                div.innerHTML += `
                    <div class="cliente-card">
                        <strong>ID: ${idCurto}</strong><br>
                        Servidor: ${cliente.server}<br>
                        User: ${cliente.username}<br>
                        Status: ${status}<br>
                        <button onclick="remover('${id}')" class="btn-danger" style="margin-top:10px;">Remover Cliente</button>
                    </div>
                `;
            }
        }

        function salvar() {
            const id = document.getElementById('id').value.trim();
            if(!id) return alert('Digite o ID ou escaneie o QR Code!');
            
            dados.clientes[id] = {
                bloqueado: document.getElementById('bloqueado').checked,
                server: document.getElementById('server').value.trim(),
                username: document.getElementById('user').value.trim(),
                password: document.getElementById('pass').value.trim()
            };
            localStorage.setItem('gil_dados', JSON.stringify(dados));
            
            // Limpa os campos
            document.getElementById('id').value = '';
            document.getElementById('server').value = '';
            document.getElementById('user').value = '';
            document.getElementById('pass').value = '';
            document.getElementById('bloqueado').checked = false;
            
            renderizar();
            alert('Salvo com sucesso! Não esqueça de baixar o JSON.');
        }

        function remover(id) {
            if(confirm('Remover cliente ' + id + '?')) {
                delete dados.clientes[id];
                localStorage.setItem('gil_dados', JSON.stringify(dados));
                renderizar();
            }
        }

        function baixarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dados, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "lista.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // Executa ao carregar a página
        renderizar();
        checarLinkDireto();
    </script>
</body>
</html>
