<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel GIL IPTV</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #08070A; color: #fff; padding: 20px; padding-bottom: 50px;}
        input, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 5px; border: none; font-size: 14px; box-sizing: border-box;}
        input { background: #222; color: #fff; }
        input:read-only { background: #333; color: #888; }
        button { background: #0B8431; color: #fff; font-weight: bold; cursor: pointer; }
        .cliente-card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;}
        .cliente-card:active { background: #222; }
        .btn-danger { background: #E92B5D; }
        .btn-warning { background: #FFC527; color: #000; }
        .btn-scan { background: #FFC527; color: #000; margin-bottom: 10px;}
        .btn-save { background: #0B8431; margin-top: 10px; }
        #reader { width: 100%; max-width: 400px; margin: 10px auto; display: none; border: 2px solid #0B8431; border-radius: 10px; }
        .config-box { background: #1A1A1A; border: 1px solid #FFC527; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .status-block { color: #E92B5D; font-weight: bold; }
        .status-ok { color: #0B8431; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 20px; border-radius: 8px; width: 90%; max-height: 80%; overflow-y: auto; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>Painel GIL IPTV</h2>

    <div class="config-box" id="config-box">
        <h3>⚙️ Configuração Inicial (Token GitHub)</h3>
        <p style="font-size: 12px; color: #aaa;">Cole o seu Token do GitHub para habilitar o salvamento automático.</p>
        <input type="password" id="token" placeholder="Cole seu Token (ghp_...) aqui">
        <button onclick="salvarToken()">Salvar Token</button>
    </div>

    <div class="cliente-card" id="form-card" style="cursor: default;">
        <h3 id="form-title">Adicionar Novo Cliente</h3>
        
        <button onclick="abrirScanner()" class="btn-scan">📷 Escanear QR Code do App</button>
        <div id="reader"></div>
        
        <input type="text" id="nome" placeholder="Nome do Cliente (Ex: João Silva)">
        <!-- ✅ Campo ID bloqueado por padrão para edição -->
        <input type="text" id="id" placeholder="ID do Aparelho" readonly>
        <input type="text" id="server" placeholder="Servidor (Ex: http://servidor.com:8080)">
        <input type="text" id="user" placeholder="Usuário">
        <input type="text" id="pass" placeholder="Senha">
        <label style="display:block; margin-top:10px;"><input type="checkbox" id="bloqueado" style="width:auto; margin-right:10px;"> Bloquear este cliente?</label>
        
        <button onclick="salvar()" class="btn-save" id="btn-save-form">Salvar e Publicar no GitHub 🚀</button>
        <button onclick="limparFormulario()" style="background: #444; display: none;" id="btn-cancel-edit">Cancelar Edição</button>
        
        <p id="status-msg" style="text-align:center; margin-top:10px; font-weight: bold;"></p>
    </div>

    <button onclick="verLoginsRecentes()" style="background: #FFC527; color: #000; margin-bottom: 20px;">📋 Ver Últimos Logins (Automático)</button>

    <h3>Clientes Cadastrados (Toque para gerenciar)</h3>
    <div id="listaClientes"></div>

    <button onclick="baixarJSON()" style="background: #333; color: #fff; margin-top: 20px;">Baixar arquivo JSON (Backup Manual)</button>

    <!-- MODAL DE LOGINS -->
    <div id="modal-logins" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Últimos Logins</h3>
            <div id="lista-logins"></div>
            <button onclick="document.getElementById('modal-logins').style.display='none'" style="background:#333; margin-top:15px;">Fechar</button>
        </div>
    </div>

    <script>
        const GITHUB_USER = "Tecsat188";
        const GITHUB_REPO = "gil-iptv";
        const GITHUB_FILE = "lista.json";
        const GITHUB_LOG_FILE = "logins_recentes.json";

        let dados = JSON.parse(localStorage.getItem('gil_dados')) || { clientes: {} };
        let html5QrcodeScanner = null;

        function carregarToken() {
            const token = localStorage.getItem('github_token');
            if (token) document.getElementById('config-box').style.display = 'none';
        }

        function salvarToken() {
            const token = document.getElementById('token').value.trim();
            if (token) {
                localStorage.setItem('github_token', token);
                document.getElementById('config-box').style.display = 'none';
                alert('Token salvo com sucesso!');
            } else {
                alert('Por favor, cole um token válido.');
            }
        }

        function abrirScanner() {
            const reader = document.getElementById('reader');
            if (reader.style.display === 'block') { fecharScanner(); return; }
            
            reader.style.display = 'block';
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    let idLido = decodedText;
                    if (decodedText.includes("?id=")) {
                        const urlParams = new URLSearchParams(decodedText.split('?')[1]);
                        idLido = urlParams.get('id');
                    }
                    document.getElementById('id').value = idLido;
                    fecharScanner();
                    alert("ID Lido: " + idLido);
                },
                (errorMessage) => { }
            ).catch((err) => {
                alert("Erro ao abrir câmera: " + err);
                fecharScanner();
            });
        }

        function fecharScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                    document.getElementById('reader').style.display = 'none';
                }).catch(err => console.log(err));
            }
        }

        function checarLinkDireto() {
            const urlParams = new URLSearchParams(window.location.search);
            const idDaUrl = urlParams.get('id');
            if (idDaUrl) {
                document.getElementById('id').value = idDaUrl;
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function renderizar() {
            const div = document.getElementById('listaClientes');
            div.innerHTML = '';
            for (const [id, cliente] of Object.entries(dados.clientes)) {
                const statusHtml = cliente.bloqueado 
                    ? '<span class="status-block">🔴 BLOQUEADO</span>' 
                    : '<span class="status-ok">🟢 LIBERADO</span>';
                
                const idCurto = id.substring(0, 8) + '...' + id.substring(id.length - 4);
                const nomeCliente = cliente.nome ? `<strong>${cliente.nome}</strong><br>` : '';
                
                div.innerHTML += `
                    <div class="cliente-card" onclick="abrirMenu('${id}')">
                        ${nomeCliente}
                        ID: ${idCurto}<br>
                        Servidor: ${cliente.server}<br>
                        User: ${cliente.username}<br>
                        Status: ${statusHtml}<br>
                        <span style="font-size: 10px; color: #888;">(Toque para editar/bloquear)</span>
                    </div>
                `;
            }
        }

        function abrirMenu(id) {
            const cliente = dados.clientes[id];
            if (!cliente) return;

            const nomeExibicao = cliente.nome ? cliente.nome : id.substring(0, 8) + '...';
            
            let opcoes = `Gerenciar: ${nomeExibicao}\n\n`;
            opcoes += `1 - ${cliente.bloqueado ? 'Desbloquear Acesso' : 'Bloquear Acesso'}\n`;
            opcoes += `2 - Editar Lista (Servidor/User/Senha)\n`;
            opcoes += `3 - Remover Cliente\n`;
            opcoes += `4 - Editar Nome do Cliente\n\n`;
            opcoes += `Digite o número da opção desejada:`;

            const escolha = prompt(opcoes);

            if (escolha === '1') {
                dados.clientes[id].bloqueado = !dados.clientes[id].bloqueado;
                publicarAutomatico("Status alterado!");
            } else if (escolha === '2') {
                // ✅ TRAVA O ID PARA NÃO CRIAR DUPLICADO
                document.getElementById('id').readOnly = true; 
                
                document.getElementById('nome').value = cliente.nome || '';
                document.getElementById('id').value = id;
                document.getElementById('server').value = cliente.server;
                document.getElementById('user').value = cliente.username;
                document.getElementById('pass').value = cliente.password;
                document.getElementById('bloqueado').checked = cliente.bloqueado;
                
                document.getElementById('form-title').innerText = "Editando: " + nomeExibicao;
                document.getElementById('btn-save-form').innerText = "Salvar Alterações 🚀";
                document.getElementById('btn-cancel-edit').style.display = "block";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (escolha === '3') {
                if(confirm('Tem certeza que deseja REMOVER o cliente ' + nomeExibicao + '?')) {
                    delete dados.clientes[id];
                    publicarAutomatico("Cliente removido!");
                }
            } else if (escolha === '4') {
                const novoNome = prompt("Digite o novo nome para " + nomeExibicao + ":", cliente.nome || "");
                if (novoNome !== null) {
                    dados.clientes[id].nome = novoNome.trim();
                    publicarAutomatico("Nome atualizado!");
                }
            }
        }

        function limparFormulario() {
            document.getElementById('id').readOnly = false; // ✅ DESTRAVA O ID
            document.getElementById('nome').value = '';
            document.getElementById('id').value = '';
            document.getElementById('server').value = '';
            document.getElementById('user').value = '';
            document.getElementById('pass').value = '';
            document.getElementById('bloqueado').checked = false;
            
            document.getElementById('form-title').innerText = "Adicionar Novo Cliente";
            document.getElementById('btn-save-form').innerText = "Salvar e Publicar no GitHub 🚀";
            document.getElementById('btn-cancel-edit').style.display = "none";
        }

        async function salvar() {
            const id = document.getElementById('id').value.trim();
            if(!id) return alert('Digite o ID!');
            
            dados.clientes[id] = {
                nome: document.getElementById('nome').value.trim(),
                bloqueado: document.getElementById('bloqueado').checked,
                server: document.getElementById('server').value.trim(),
                username: document.getElementById('user').value.trim(),
                password: document.getElementById('pass').value.trim()
            };
            
            limparFormulario();
            publicarAutomatico("Dados salvos e publicados!");
        }

        async function publicarAutomatico(msgSucesso) {
            localStorage.setItem('gil_dados', JSON.stringify(dados));
            renderizar();

            const token = localStorage.getItem('github_token');
            const statusMsg = document.getElementById('status-msg');

            if(!token) {
                document.getElementById('config-box').style.display = 'block';
                statusMsg.innerText = "❌ Token não configurado!";
                statusMsg.style.color = "#E92B5D";
                return alert('Configure o Token do GitHub primeiro!');
            }

            statusMsg.innerText = "⏳ Publicando no GitHub...";
            statusMsg.style.color = "#FFC527";

            const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(dados, null, 2))));
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;

            try {
                let sha = null;
                const getResponse = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    sha = fileData.sha;
                }

                const putResponse = await fetch(url, {
                    method: 'PUT',
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: "Atualizar lista via Painel Web",
                        content: conteudoBase64,
                        sha: sha 
                    })
                });

                if (putResponse.ok) {
                    statusMsg.innerText = "✅ " + msgSucesso;
                    statusMsg.style.color = "#0B8431";
                    setTimeout(() => { statusMsg.innerText = ""; }, 4000);
                } else {
                    const errorData = await putResponse.json();
                    statusMsg.innerText = "❌ Erro no GitHub: " + errorData.message;
                    statusMsg.style.color = "#E92B5D";
                }
            } catch (e) {
                statusMsg.innerText = "❌ Erro de conexão.";
                statusMsg.style.color = "#E92B5D";
            }
        }

        async function verLoginsRecentes() {
            const token = localStorage.getItem('github_token');
            if(!token) return alert("Configure o token primeiro!");

            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_LOG_FILE}`;
            
            try {
                const response = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                const modal = document.getElementById('modal-logins');
                const lista = document.getElementById('lista-logins');

                if (!response.ok) {
                    lista.innerHTML = "<p>Nenhum login recente registrado ainda.</p>";
                    modal.style.display = 'flex';
                    return;
                }

                const fileData = await response.json();
                const conteudoBase64 = fileData.content.replaceAll("\\s", "");
                const jsonStr = decodeURIComponent(escape(atob(conteudoBase64)));
                const logins = JSON.parse(jsonStr);

                lista.innerHTML = "";
                const entries = Object.entries(logins).reverse(); 
                
                if (entries.length === 0) {
                    lista.innerHTML = "<p>Nenhum login registrado ainda.</p>";
                } else {
                    for (const [id, info] of entries) {
                        // ✅ Agora passa a senha e mostra se já está cadastrado
                        const jaCadastrado = dados.clientes[id] ? "(JÁ CADASTRADO)" : "";
                        lista.innerHTML += `
                            <div class="cliente-card" style="cursor:default;">
                                <strong>ID: ${id} ${jaCadastrado}</strong><br>
                                Servidor: ${info.server}<br>
                                Usuário: ${info.username}<br>
                                <span style="color:#0B8431;">Data: ${info.data}</span>
                                <button onclick="puxarParaEdicao('${id}', '${info.server}', '${info.username}', '${info.password || ''}')" style="background:#FFC527; color:#000; padding:5px; margin-top:5px;">Cadastrar/Atualizar este Cliente</button>
                            </div>
                        `;
                    }
                }
                modal.style.display = 'flex';

            } catch (e) {
                alert("Erro ao ler logins: " + e.message);
            }
        }

        function puxarParaEdicao(id, server, user, pass) {
            document.getElementById('id').readOnly = true; // ✅ Trava o ID
            
            document.getElementById('id').value = id;
            document.getElementById('server').value = server;
            document.getElementById('user').value = user;
            document.getElementById('pass').value = pass || '';
            
            document.getElementById('form-title').innerText = "Cadastrando Login de: " + id.substring(0, 8) + "...";
            document.getElementById('btn-save-form').innerText = "Salvar e Publicar no GitHub 🚀";
            document.getElementById('btn-cancel-edit').style.display = "block";
            
            document.getElementById('modal-logins').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            alert("Dados carregados! Agora preencha o Nome do cliente, confira a senha e clique em Salvar.");
        }

        function baixarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dados, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "lista.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        carregarToken();
        renderizar();
        checarLinkDireto();
    </script>
</body>
</html>
